name: LOGOS tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r v5/requirements.txt
      - run: python -m unittest discover -v
        working-directory: v5
      - run: python -m unittest discover -v
        working-directory: v6
      - run: python -m unittest v61.test_engine -v
      - run: python -m unittest v62.test_collect -v
